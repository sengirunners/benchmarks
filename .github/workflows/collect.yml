# Reads every finished bench run through the GitHub API and writes results/results.json and
# results/results.csv; commits them when they changed. The only job in this repository that can
# write, and it runs on GitHub's own runner. It first checks every workflow's triggers.
name: collect
on:
  workflow_dispatch:
  # Sunday, after the five weekly bench runs.
  schedule:
    - cron: '47 14 * * 0'
permissions:
  contents: read
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    name: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check workflow triggers, permissions and pins
        run: ruby scripts/check_workflows.rb
      - name: Collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/collect.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Results: collected $(date -u +%F)"
            git push
          fi
